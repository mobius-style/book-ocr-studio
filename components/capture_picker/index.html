<!doctype html><html lang="en"><meta charset="utf-8"><style>
body{font:15px system-ui,sans-serif;margin:0;color:#1e293b}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}button{background:white;border:1px solid #94a3b8;border-radius:7px;padding:9px 13px;cursor:pointer;font:inherit}button.primary{background:#087f8c;color:white;border-color:#087f8c}button:disabled{opacity:.5;cursor:default}#hint{background:#eff6ff;padding:10px;border-radius:8px;margin:8px 0}canvas{width:100%;height:auto;display:block;cursor:crosshair;touch-action:none;border:1px solid #cbd5e1;box-sizing:border-box}#state{margin:8px 0;font-size:14px;color:#475569}
</style><header><button id="rect">1. Select text area</button><button id="next">2. Select next-page button</button><button id="reset">Reset</button><button id="confirm" class="primary" disabled>Use these settings</button></header><div id="hint">Drag from the top-left to the bottom-right of the text area in the image.</div><canvas id="canvas" aria-label="Select the text area and next-page button in this image"></canvas><div id="state">Select the text area.</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),img=new Image();let clip=null,next=null,start=null,mode='rect',token='',pendingImage='',guides=false;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function draw(){if(!img.complete||!img.naturalWidth)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);if(guides&&clip){ctx.strokeStyle='#64748b';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.strokeRect(clip.x,clip.y,clip.width,clip.height);ctx.setLineDash([])}if(guides&&next){ctx.strokeStyle='#e11d48';ctx.lineWidth=4;ctx.beginPath();ctx.arc(next[0],next[1],15,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(next[0]-20,next[1]);ctx.lineTo(next[0]+20,next[1]);ctx.moveTo(next[0],next[1]-20);ctx.lineTo(next[0],next[1]+20);ctx.stroke()}document.getElementById('confirm').disabled=!(clip&&clip.width>=80&&clip.height>=80&&next);document.getElementById('state').textContent=(clip?'Text area: selected':'Text area: not selected')+' ／ '+(next?'Next page: selected':'Next page: not selected');height()}
function pos(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width-1,Math.round((e.clientX-r.left)*canvas.width/r.width))),Math.max(0,Math.min(canvas.height-1,Math.round((e.clientY-r.top)*canvas.height/r.height)))]}
function setMode(m){mode=m;document.getElementById('hint').textContent=m==='rect'?'Drag from the top-left to the bottom-right of the text area in the image.':'Click the next-page arrow in the image. It may be on the left for vertical text.'}
canvas.onpointerdown=e=>{guides=true;const p=pos(e);if(mode==='next'){next=p;draw();return}start=p;canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!start)return;const p=pos(e);clip={x:Math.min(start[0],p[0]),y:Math.min(start[1],p[1]),width:Math.abs(start[0]-p[0]),height:Math.abs(start[1]-p[1])};draw()};
canvas.onpointerup=e=>{if(start){start=null;if(clip&&clip.width>=80&&clip.height>=80)setMode('next');draw()}};
document.getElementById('rect').onclick=()=>{guides=true;setMode('rect');draw()};document.getElementById('next').onclick=()=>{guides=true;setMode('next');draw()};document.getElementById('reset').onclick=()=>{clip=null;next=null;setMode('rect');draw()};
document.getElementById('confirm').onclick=()=>{guides=false;draw();send('streamlit:setComponentValue',{value:{clip,next,token},dataType:'json'});document.getElementById('hint').textContent='Settings saved. Press Test capture below.'};
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const args=e.data.args;if(args.token!==token){token=args.token;guides=false;clip=args.selection?.clip||null;next=args.selection?.next||null;setMode(clip?'next':'rect')}if(args.image!==pendingImage){pendingImage=args.image;img.src=args.image}else draw()});
img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw()};window.addEventListener('resize',height);send('streamlit:componentReady',{apiVersion:1});
</script></html>
